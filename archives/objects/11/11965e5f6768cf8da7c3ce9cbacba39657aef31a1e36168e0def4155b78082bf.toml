[build]
  command = "npm run build"
  publish = "dist"

# Two current HTML entry points; missing textures must remain real 404s.
# Do not add an SPA catch-all rewrite to index.html.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

# Content-addressed runtime assets can be reused across visits. Source downloads revalidate.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/backgrounds/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cities/v4/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cities/v4/catalog.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
