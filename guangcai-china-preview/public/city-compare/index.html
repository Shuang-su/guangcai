<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>23城图案逐项对比 · 城市共彩</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#2e342e;background:#f5f3ed;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input{touch-action:manipulation}a{color:#326854}button{cursor:pointer}header{padding:30px 38px 24px;border-bottom:1px solid #d9ded5;background:#fbfaf6}header small{letter-spacing:.18em;color:#7b785f}h1{font-family:"Songti SC",serif;font-size:30px;line-height:1.3;margin:12px 0}header p{font-size:14px;color:#62675e;line-height:1.8;max-width:850px;margin:0}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1620px;margin:auto}nav{padding:26px 16px;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid #dce0d8}.city{display:flex;width:100%;align-items:center;justify-content:space-between;padding:12px 15px;border:0;border-radius:8px;background:transparent;color:#4a5148;text-align:left;margin-bottom:3px}.city.active{background:#2f5e4b;color:white}.city em{font-size:11px;font-style:normal;opacity:.65}.city:hover:not(.active){background:#e9ece3}main{padding:30px 36px 60px;min-width:0}.mobile-nav{display:none}.topline{display:flex;justify-content:space-between;gap:15px;align-items:start}h2{font-family:"Songti SC",serif;font-size:31px;margin:0 0 8px}.badge{display:inline-block;font-size:12px;background:#e5ecdf;padding:5px 10px;border-radius:30px;margin-bottom:12px}.step{display:flex;gap:8px}.step button,.tabs button{background:#fffdf8;border:1px solid #d6dccf;border-radius:6px;padding:8px 13px;color:#384c3d}.tabs{display:flex;gap:7px;margin:12px 0 18px}.tabs button.active{background:#2f5e4b;color:white}.action{font-size:14px;color:#5a6255;line-height:1.8;margin:4px 0 20px}.notes{padding:15px 20px;border-left:3px solid #a88440;background:#fffdf7;font-size:14px;line-height:1.9;margin:18px 0}.notes p{margin:5px 0}section{margin-top:28px}h3{font-size:17px;font-weight:600;margin:0 0 12px}.muted{color:#6e776a;font-size:12px;line-height:1.8}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.figure{margin:0;background:#fffdf7;border:1px solid #e1e4d8;border-radius:8px;overflow:hidden}.figure figcaption{padding:9px 12px;font-size:12px;border-bottom:1px solid #e6e9de;color:#666c5c;display:flex;justify-content:space-between}.figure img{display:block;width:100%;height:auto;min-height:30px}.figure .cup{aspect-ratio:1.2;object-fit:contain;background:#f7f4ef}.overlay img{width:100%;display:block}.overlay{border:1px solid #dfe3d6;background:#fffdf7;border-radius:8px;overflow:hidden;margin-top:12px}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;padding:10px 14px;color:#5d6656}.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:50%}.wipe{position:relative;line-height:0;overflow:hidden;background:#fffdf7;border-radius:8px;border:1px solid #dce1d2}.wipe img{display:block;width:100%;height:auto}.wipe .new{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}.wipe .divider{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#457459}.wipe .tag{position:absolute;top:12px;font-size:12px;line-height:1.4;background:#fffdf5e8;padding:5px 10px;border-radius:4px}.wipe .oldtag{right:12px}.wipe .newtag{left:12px}.slider{display:flex;align-items:center;gap:12px;padding:11px 0;color:#5a6554;font-size:12px}.slider input{width:100%;accent-color:#3b6a52}table{width:100%;border-collapse:collapse;font-size:12px;background:#fffdf7;border:1px solid #dce1d2}th,td{padding:10px 12px;border-bottom:1px solid #e1e5d8;text-align:left}th{color:#5c6755;font-weight:500;background:#ecf0e5}.tablewrap{overflow:auto}details{margin-top:14px;font-size:12px;color:#65705c}summary{cursor:pointer;padding:10px 0}code{word-break:break-all;font-size:11px}footer{font-size:12px;line-height:1.9;margin-top:30px;padding-top:15px;border-top:1px solid #dce2d2;color:#6e7667}.toolbar{display:flex;align-items:center;gap:15px;flex-wrap:wrap}.toolbar label{font-size:12px;color:#66715d}.empty{padding:50px}.source-metrics{display:flex;gap:22px;flex-wrap:wrap;padding:12px 0;font-size:12px;color:#58664f}.source-metrics b{display:block;margin-top:5px;color:#2e4232;font-size:14px;font-weight:500}
@media(max-width:800px){header{padding:22px 20px}h1{font-size:25px}.layout{display:block}nav{display:none}main{padding:22px 16px 40px}.mobile-nav{display:flex;align-items:center;gap:12px;margin-bottom:25px}.mobile-nav select{flex:1;padding:10px;border:1px solid #cdd6c4;border-radius:6px;background:#fffdf7}.pair{grid-template-columns:1fr}.pair.both-small{grid-template-columns:1fr 1fr;gap:7px}.topline{align-items:center}h2{font-size:27px}.step button{padding:7px 10px}.source-metrics{gap:16px}th,td{padding:9px 8px;white-space:nowrap}.figure figcaption{font-size:11px;padding:8px}.wipe .tag{font-size:10px;top:6px}section{margin-top:25px}.notes{padding:12px 15px}}
</style></head><body>
<header><small>CITY ARTWORK REVIEW · 2026.10.19</small><h1>23城图案，逐项对比。</h1><p>V7.1.3 / v7-4 → V7.1.4 / v7-5。逐城核对原稿、杯身展开图、底边及同机位渲染。7城金线有变化，2城仅少数导出像素变化，14城原件完全相同；全部统一到底部。<a href="../bezier-lab/">独立建筑SVG试绘</a> · <a href="../">返回城市共彩</a></p></header>
<div class="layout"><nav aria-label="23个城市"><div class="toolbar" style="padding:0 12px 15px"><label><input id="only-changed" type="checkbox"> 仅看原稿变化</label></div><div id="cities"></div></nav><main><div class="mobile-nav"><label for="city-select">选择城市</label><select id="city-select"></select></div><article id="content"><p class="empty">正在载入对比材料…</p></article></main></div>
<script>
let data,index=0,finish='blue';const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={light:'低档 · 1024',standard:'标准 · 2048',detail:'精细 · 4096'};
function figure(src,label,cls=''){return `<figure class="figure"><figcaption>${label}</figcaption><img class="${cls}" loading="lazy" src="${src}" alt="${esc(label)}"></figure>`}
function render(){const c=data.cities[index],s=c.source;location.hash=c.id;document.title=c.name+'图案对比 · 城市共彩';
$('#content').innerHTML=`<div class="topline"><div><h2>${c.name}</h2><span class="badge">${s.pixelChanged?'原稿像素有变化':'原稿像素相同 · 底部对齐'}</span></div><div class="step"><button id="prev" aria-label="上一个城市">←</button><button id="next" aria-label="下一个城市">→</button></div></div><p class="action">${c.action}</p>
<div class="notes">${c.notes.map(n=>`<p>${esc(n)}</p>`).join('')}<p class="muted">${c.reviewed?'已完成逐城图像复核。':'待完成逐城图像复核。'}杯身前后图使用相同应用、相机、材质参数和画布尺寸。</p></div>
<section><h3>① 原稿描线 · 同一画板</h3><div class="source-metrics"><span>画板<b>${s.size.join(' × ')} px</b></span><span>旧描线范围（左、上、右、下）<b>${s.beforeBounds.join(' / ')}</b></span><span>新描线范围<b>${s.afterBounds.join(' / ')}</b></span></div><div class="pair both-small">${figure(c.images.sourceBefore,c.name+' · 旧原稿')}${figure(c.images.sourceAfter,c.name+' · 新附件')}</div><p class="muted">原稿预览为附件金线提取，保留整画板位置与比例；PSD和原件下载未公开。文件不同不等同于建筑全部重画。</p></section>
<section><h3>② 杯身展开图 · 拖动比较</h3><div class="wipe"><img src="${c.images.flatBefore}" alt="旧版杯身展开图"><div class="new"><img src="${c.images.flatAfter}" alt="新版杯身展开图"></div><div class="divider"></div><span class="tag newtag">新版 V7.1.4</span><span class="tag oldtag">旧版 V7.1.3</span></div><div class="slider"><span>旧 / 新叠合位置</span><input id="wipe-range" type="range" min="0" max="100" value="50" aria-label="新旧展开图分界位置"></div><div class="overlay"><img src="${c.images.overlay}" loading="lazy" alt="${c.name}新旧描线差异叠图"><div class="legend"><span><i style="background:#b78f3c"></i>重合</span><span><i style="background:#c5367d"></i>旧版独有</span><span><i style="background:#008ba8"></i>新版独有</span></div></div><p class="muted">叠图在实际贴图坐标上直接比较，包含到底部的平移。细线移动1像素也会形成双色边；不能把差异面积当作错误数量。</p></section>
<section><h3>③ 底部64行 · 纵向4倍放大</h3><div class="pair both-small">${figure(c.images.bottomBefore,'旧版 · 中央1024px窗口')}${figure(c.images.bottomAfter,'新版 · 相同像素窗口')}</div><div class="tablewrap"><table><thead><tr><th>档位</th><th>贴图尺寸</th><th>旧实色底隙</th><th>新实色底隙</th><th>底行位移</th></tr></thead><tbody>${c.tiers.map(t=>`<tr><td>${labels[t.tier]}</td><td>${t.size.join(' × ')}</td><td>${t.beforeGap} px</td><td>${t.afterGap} px</td><td>向下 ${t.translatedRows} px</td></tr>`).join('')}</tbody></table></div><p class="muted">实色描线按通道值&gt;127计算。辅助填色闭合不会生成一条新的金色水平线。低档的抗锯齿边已单独核对。</p></section>
<section><h3>④ 杯身实际效果 · 同机位</h3><div class="tabs" role="tablist" aria-label="对比材质"><button data-finish="blue" role="tab">蓝色填色 + 金线</button><button data-finish="gold" role="tab">同心金</button></div><div class="pair" id="cup-pair"></div><p class="muted">蓝色用于区分金线和建筑填色；同心金检查连续金属与浮雕。自动化渲染图不代表实体陶瓷或iPhone屏幕验收。</p></section>
<section><h3>⑤ 文字与字框</h3><p class="muted">按本轮最终要求，六组文字、字形、字框及其位置和尺寸全部沿用 V7.1.3；本轮只更新城市线稿与底部对齐。</p></section><details><summary>来源摘要与测量口径</summary><p>旧原图SHA-256<br><code>${s.beforeSha256}</code></p><p>新附件SHA-256<br><code>${s.afterSha256}</code></p><p>文件变化：${s.fileChanged?'是':'否'}；RGBA像素变化：${s.pixelChanged?'是':'否'}；原稿二值金线直接IoU：${(s.rawInkIoU*100).toFixed(2)}%。IoU对细线位移敏感，不作为质量分数。</p><p>${esc(data.thresholds)}</p></details><footer>本页固定比较 V7.1.3 / v7-4 与 V7.1.4 / v7-5。23城均有独立材料，可用左右按钮逐项查看。<br><a href="data.json">查看完整对比数据</a> · <a href="../">返回杯身交互预览</a></footer>`;
$('#prev').onclick=()=>choose((index+22)%23);$('#next').onclick=()=>choose((index+1)%23);$('#wipe-range').oninput=e=>{const v=e.target.value;$('.wipe .new').style.clipPath=`inset(0 ${100-v}% 0 0)`;$('.wipe .divider').style.left=v+'%'};document.querySelectorAll('[data-finish]').forEach(b=>b.onclick=()=>{finish=b.dataset.finish;renderCups()});renderCups();renderNav();$('#city-select').value=c.id;
}
function renderCups(){const c=data.cities[index];$('#cup-pair').innerHTML=figure(`images/${c.id}-${finish}-before.webp`,'V7.1.3 · 旧版杯身','cup')+figure(`images/${c.id}-${finish}-after.webp`,'V7.1.4 · 新版杯身','cup');document.querySelectorAll('[data-finish]').forEach(b=>{b.classList.toggle('active',b.dataset.finish===finish);b.setAttribute('aria-selected',String(b.dataset.finish===finish))})}
function choose(i){index=i;render()}
function renderNav(){const only=$('#only-changed').checked;$('#cities').innerHTML=data.cities.map((c,i)=>only&&!c.source.pixelChanged?'':`<button class="city ${index===i?'active':''}" data-index="${i}" ${index===i?'aria-current="true"':''}>${c.name}<em>${c.source.pixelChanged?'原稿更新':'底部对齐'}</em></button>`).join('');document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.index)))}
$('#only-changed').onchange=renderNav;$('#city-select').onchange=e=>choose(data.cities.findIndex(c=>c.id===e.target.value));window.addEventListener('hashchange',()=>{const i=data?.cities.findIndex(c=>c.id===location.hash.slice(1));if(i>=0&&i!==index)choose(i)});
fetch('data.json').then(r=>{if(!r.ok)throw Error('对比数据读取失败');return r.json()}).then(d=>{data=d;$('#city-select').innerHTML=d.cities.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');const i=d.cities.findIndex(c=>c.id===location.hash.slice(1));if(i>=0)index=i;render()}).catch(e=>{$('#content').textContent=e.message});
</script></body></html>
