<!doctype html><html lang="zh-CN"><head><link rel="icon" href="data:,"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V7 资源与作品联调样例</title><script src="%BASE_URL%runtime-config.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#29251e;font:15px/1.65 system-ui}main{display:grid;grid-template-columns:minmax(300px,1fr) 390px;min-height:100vh}iframe{width:100%;height:100vh;border:0;position:sticky;top:0}aside{padding:24px;border-left:1px solid #ded8ca}h1{font-size:22px;line-height:1.4}p{color:#645f54}button,input,select{font:inherit;padding:9px 12px;border:1px solid #bdb5a5;border-radius:8px;background:white}button{cursor:pointer}button:disabled{opacity:.45;cursor:wait}label{display:block;margin:14px 0}input,select{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}pre{white-space:pre-wrap;word-break:break-word;font-size:11px;background:white;padding:12px;max-height:330px;overflow:auto}#status{min-height:3em}a{color:#72550a;word-break:break-all}@media(max-width:760px){main{display:block}iframe{height:70vh;position:relative}aside{border:0}}
</style></head><body><main><iframe title="城市共彩 V7" id="viewer"></iframe><aside><h1>V7 资源与作品联调样例</h1><p>本地模拟服务 · 演示账号与数据仅供接入参考，重启服务即清空。</p><label>模拟身份<select id="identity"><option value="">匿名查看</option><option value="alice">演示用户 Alice</option><option value="bob">演示用户 Bob</option></select></label><label>作品名称<input id="title" maxlength="120" value="我的城市杯"></label><div class="row"><button id="save">保存为新作品</button><button id="update">更新作品</button><button id="refresh">刷新列表</button></div><label>我的作品<select id="works"><option value="">请选择</option></select></label><div class="row"><button id="load">还原作品</button><button id="share">创建分享</button><button id="revoke">撤销本次分享</button></div><p id="status" role="status"></p><a id="share-link" target="_blank" rel="noopener"></a><details open><summary>作品参数</summary><pre id="design">等待观察器…</pre></details><p>资源目录与配置来自同一 bootstrap；这里展示前后端如何配合，不包含正式业务页面。</p></aside></main><script type="module" src="./sample.ts"></script></body></html>
