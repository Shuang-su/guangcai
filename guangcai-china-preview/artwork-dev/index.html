n><option value="purple">紫韵</option></select></label><label>视角<select id="view" aria-label="视角"><option value="hero">建筑面整体</option><option value="combined">侧面总览</option><option value="detail">建筑近看</option><option value="front">文字面</option><option value="handle">把手与侧花纸</option><option value="flowers">杯碟花纸</option><option value="exploded">部件拆解</option></select></label></div><div class="actions"><button id="reset">恢复默认组合</button><button id="download">保存预览图</button></div><p id="notice" class="notice">贝塞尔稿目前提供深圳和北京，使用独立闭合建筑 SVG。新城市稿、字框和两城SVG共用PSD等比矩阵，宽度100%、底边对齐；顶部约3.44%为比例差留白。旧映射可单独对照。</p><a id="source-svg" hidden target="_blank" rel="noopener">查看本城原始 SVG ↗</a><coverage-review id="coverage-review" city="shenzhen" slogan="ocean" compact></coverage-review><details><summary>当前组合与来源</summary><pre id="details"></pre></details></aside><section class="preview" aria-label="杯身预览"><div class="stage-bar"><span id="combination">正在准备预览</span><span>独立实验画布</span></div><iframe id="cup" src="./cup.html" title="开发预览杯身" allow="web-share"></iframe><p id="status" role="status" aria-live="polite">正在载入杯身与素材…</p></section></main><script type="module" src="../src/lab/index.ts"></script></body></html>
