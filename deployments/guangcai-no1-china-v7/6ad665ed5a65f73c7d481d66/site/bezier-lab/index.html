$('#focus').onclick=()=>{const b=meta[city].find(b=>b.key===building());if(!b){status.textContent='先从列表选择一栋建筑。';return;}focused=true;active().querySelector('svg').setAttribute('viewBox',b.box.join(' '));active().style.aspectRatio=`${b.box[2]} / ${b.box[3]}`;$('#mode').value='vector';apply();};
$('#overview').onclick=()=>{all();$('.workspace').scrollTo(0,0);};
$$('.drawing').forEach(svg=>svg.addEventListener('click',e=>{const path=e.target.closest('path[data-role]');if(!path)return;selected?.classList.remove('selected-path');selected=path;selected.classList.add('selected-path');const w=path.getAttribute('stroke-width')||'3.2';if(!path.dataset.originalWidth)path.dataset.originalWidth=w;$('#width').disabled=false;$('#width').value=w;$('#widthValue').value=w;status.textContent=`选中 ${path.id} · ${path.dataset.label||'建筑完整闭合轮廓'} · SVG 中可独立选择此路径。`;}));
$('#width').oninput=()=>{if(selected){selected.setAttribute('stroke-width',$('#width').value);$('#widthValue').value=$('#width').value;}};
$('#reset').onclick=()=>{$$('path[data-original-width]').forEach(p=>p.setAttribute('stroke-width',p.dataset.originalWidth));if(selected){$('#width').value=selected.getAttribute('stroke-width');$('#widthValue').value=$('#width').value;}status.textContent='已恢复试调线宽。原 SVG 文件不受查看器中的调整影响。';};
list();apply();
</script></html>
